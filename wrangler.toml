# Cloudflare ayarları (Workers + statik dosyalar).
#
# Cloudflare panelinde "Workers & Pages → Create → Import a repository" ile açılan proje bu dosyayı okur:
# önce `npm run build` derler, sonra `npx wrangler deploy` dist klasörünü yayınlar. `npm run deploy` de aynısını yapar.
# Adres: https://oba-tales.etmk.workers.dev (hesabın workers.dev alt alanı "etmk"; kendi alan adını panelden
# bağlarsan .env → VITE_SITE_URL satırını da değiştir).
name = "oba-tales"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
# Tek sayfalık uygulama: /karakterler gibi adresler doğrudan açılınca index.html döner.
not_found_handling = "single-page-application"
